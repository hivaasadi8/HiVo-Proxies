<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>⚡️ HiVo Configs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0b0d12; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.09); --txt:#e8ecf4; --dim:#8b93a7; --acc:#5b8cff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background: radial-gradient(1000px 500px at 50% -10%, #17223f 0%, var(--bg) 60%); color:var(--txt);
         font-family:-apple-system,'Vazirmatn',Tahoma,sans-serif; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; padding:16px 14px 92px; }
  header { text-align:center; padding:20px 0 8px; }
  .logo { font-size:32px; }
  h1 { font-size:20px; font-weight:800; letter-spacing:.5px; margin-top:4px; }
  .hello { color:var(--acc); font-size:12.5px; margin-top:6px; }
  .tag { color:var(--dim); font-size:12px; margin-top:5px; }
  .stats { display:flex; gap:10px; margin:16px 0 12px; }
  .stat { flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:13px 8px; text-align:center; backdrop-filter:blur(10px); }
  .stat b { font-size:19px; }
  .stat span { display:block; color:var(--dim); font-size:10.5px; margin-top:4px; }
  .search { width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt);
            border-radius:14px; padding:12px 14px; font-size:14px; outline:none; margin-bottom:10px; }
  .search:focus { border-color:var(--acc); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
  .chip { flex-shrink:0; padding:7px 15px; border-radius:999px; background:var(--card);
          border:1px solid var(--line); color:var(--dim); font-size:12.5px; cursor:pointer; }
  .chip.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px;
          margin-bottom:10px; display:flex; align-items:center; gap:10px; animation:up .35s ease both; }
  @keyframes up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .meta { flex:1; min-width:0; }
  .name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--dim); font-size:11px; margin-top:3px; }
  .copy { background:var(--acc); color:#fff; border:none; border-radius:10px; padding:8px 13px;
          font-size:12px; cursor:pointer; flex-shrink:0; }
  .copy:active { transform:scale(.94); }
  .bar { position:fixed; bottom:0; left:0; right:0; background:rgba(11,13,18,.92);
         backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:12px;
         display:flex; gap:10px; justify-content:center; }
  .btn { background:var(--acc); color:#fff; border:none; border-radius:12px; padding:12px 24px;
         font-size:14px; font-weight:700; cursor:pointer; }
  .btn.ghost { background:var(--card); border:1px solid var(--line); color:var(--txt); }
  #toast { position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(16px);
           background:#1c2434; border:1px solid var(--line); color:#fff; padding:10px 20px;
           border-radius:999px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:9; }
  #toast.on { opacity:1; transform:translateX(-50%); }
  .empty { text-align:center; color:var(--dim); padding:44px 0; font-size:13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⚡️</div>
    <h1>HiVo Configs</h1>
    <div class="hello" id="hello"></div>
    <div class="tag">「 آزادی، یک اتصال فاصله دارد 」</div>
  </header>
  <div class="stats">
    <div class="stat"><b id="stCount">…</b><span>کانفیگ زنده</span></div>
    <div class="stat"><b id="stCountry">…</b><span>کشور</span></div>
    <div class="stat"><b id="stBest">…</b><span>بهترین پینگ</span></div>
  </div>
  <input id="q" class="search" placeholder="🔍 جستجو… کشور، شهر، پروتکل">
  <div class="chips" id="chips"></div>
  <div id="list"><div class="empty">「 در حال بارگذاری… 」</div></div>
</div>
<div class="bar">
  <button class="btn" onclick="downloadAll()">📄 دانلود همه</button>
  <button class="btn ghost" onclick="load()">🔄 به‌روزرسانی</button>
</div>
<div id="toast">کپی شد ✅</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
try {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) document.getElementById('hello').textContent = 'سلام ' + (u.first_name || '') + ' 👋';
} catch(e) {}

let ALL = [], PROTO = 'همه';

function b64d(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return new TextDecoder().decode(u);
}
function parse(line) {
  line = line.trim(); if (!line) return null;
  if (line.toLowerCase().startsWith('vmess://')) {
    try { const j = JSON.parse(b64d(line.slice(8)));
          return { name: j.ps || 'VMess', proto: 'VMess', uri: line }; }
    catch(e) { return null; }
  }
  const p = line.split('://')[0].toLowerCase();
  const map = { vless:'VLESS', trojan:'Trojan', ss:'SS', hysteria2:'Hysteria2', hysteria:'Hysteria' };
  if (!map[p]) return null;
  const h = line.indexOf('#');
  const name = h > -1 ? decodeURIComponent(line.slice(h + 1)) : map[p];
  return { name, proto: map[p], uri: line };
}
const flagOf = s => { const m = s.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u); return m ? m[0] : '🌐'; };
const msOf   = s => { const m = s.match(/(\d+)\s*ms/i); return m ? +m[1] : null; };
function countryOf(s) {
  let t = s.replace(/HiVo\s*Configs/i, '').replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu, '');
  return t.split('|')[0].trim() || 'نامشخص';
}

function load() {
  document.getElementById('list').innerHTML = '<div class="empty">「 در حال بارگذاری… 」</div>';
  fetch('sub.txt?' + Date.now())
    .then(r => { if (!r.ok) throw 0; return r.text(); })
    .then(t => {
      ALL = t.split('\n').map(parse).filter(Boolean);
      ALL.forEach(c => { c.flag = flagOf(c.name); c.ms = msOf(c.name); c.country = countryOf(c.name); });
      ALL.sort((a, b) => (a.ms ?? 9e3) - (b.ms ?? 9e3));
      renderStats(); renderChips(); render();
    })
    .catch(() => { document.getElementById('list').innerHTML =
      '<div class="empty">「 هنوز چیزی نیست؛ به‌زودی 」</div>'; });
}
function renderStats() {
  document.getElementById('stCount').textContent = ALL.length;
  document.getElementById('stCountry').textContent = new Set(ALL.map(c => c.country)).size;
  const best = ALL.find(c => c.ms !== null);
  document.getElementById('stBest').textContent = best ? best.ms + 'ms' : '—';
}
function renderChips() {
  const ps = ['همه', ...new Set(ALL.map(c => c.proto))];
  document.getElementById('chips').innerHTML = ps.map(p =>
    '<div class="chip' + (p === PROTO ? ' on' : '') + '" onclick="setP(\'' + p + '\')">' + p + '</div>').join('');
}
function setP(p) { PROTO = p; renderChips(); render(); }
function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  return ALL.filter(c =>
    (PROTO === 'همه' || c.proto === PROTO) &&
    (!q || (c.name + ' ' + c.country + ' ' + c.proto).toLowerCase().includes(q)));
}
function render() {
  const items = filtered();
  const el = document.getElementById('list');
  if (!items.length) { el.innerHTML = '<div class="empty">「 چیزی پیدا نشد 」</div>'; return; }
  el.innerHTML = items.slice(0, 300).map((c, i) =>
    '<div class="card" style="animation-delay:' + Math.min(i * 25, 400) + 'ms">' +
    '<div class="meta"><div class="name">' + c.flag + ' ' + esc(c.name) + '</div>' +
    '<div class="sub">' + c.proto + (c.ms ? ' · ⏱ ' + c.ms + 'ms' : '') + '</div></div>' +
    '<button class="copy" onclick="copyUri(' + ALL.indexOf(c) + ')">کپی</button></div>').join('');
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1400);
}
function copyUri(i) {
  const uri = ALL[i].uri;
  const done = () => toast('کپی شد ✅');
  if (navigator.clipboard) navigator.clipboard.writeText(uri).then(done).catch(fallback);
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = uri; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  }
}
function downloadAll() {
  const blob = new Blob([ALL.map(c => c.uri).join('\n') + '\n'], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'HiVo-Configs.txt'; a.click();
  toast('دانلود شد 📄');
}
document.getElementById('q').addEventListener('input', render);
load();
</script>
</body>
</html>
