<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HiVo Proxies</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,Tahoma,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px;max-width:820px;margin:0 auto;min-height:100vh}
  h1{font-size:1.5rem;margin:0 0 8px}
  #status{opacity:.75;margin:0 0 18px;font-size:.9rem}
  .bar{margin-bottom:14px}
  .bar input{width:100%;background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:10px;border-radius:8px;font-size:.9rem}
  .list{list-style:none;padding:0;margin:0}
  .list li{background:#161b22;border:1px solid #30363d;padding:12px;border-radius:8px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .proto{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;background:#1f6feb;color:#fff}
  .idx{opacity:.55;font-size:.8rem}
  button{background:#238636;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;margin-right:auto}
  button:hover{background:#2ea043}
  .line{font-size:.75rem;opacity:.55;word-break:break-all;line-height:1.5}
  a{color:#58a6ff;text-decoration:none;word-break:break-all}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<h1>⚡ HiVo Proxies</h1>
<p id="status">در حال بارگذاری…</p>
<div class="bar">
  <input id="q" placeholder="🔍 جستجو در پروکسی‌ها…">
</div>
<ul class="list" id="list"></ul>

<script>
const URLS = [
  './proxies.txt',
  'https://raw.githubusercontent.com/hivaasadi8/HiVo-Proxies/main/proxies.txt',
  'https://cdn.jsdelivr.net/gh/hivaasadi8/HiVo-Proxies@main/proxies.txt'
];

async function load(){
  for (const u of URLS){
    try{
      const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
      if(!r.ok) continue;
      const t = await r.text();
      const lines = t.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.includes('/proxy?'));
      if(lines.length) return lines;
    }catch(e){}
  }
  throw new Error('proxies.txt در دسترس نیست');
}

let ALL = [];
function render(lines){
  const list = document.getElementById('list');
  document.getElementById('status').textContent = lines.length + ' پروکسی زنده';
  list.innerHTML = '';
  lines.forEach((line,i)=>{
    const li = document.createElement('li');
    const safe = line.replace(/[<>]/g,'');
    li.innerHTML =
      '<div class="row">' +
        '<span class="proto">MTProto</span>' +
        '<span class="idx">#' + (i+1) + '</span>' +
        '<button>کپی</button>' +
      '</div>' +
      '<div class="line"><a href="' + safe + '" target="_blank">' + safe + '</a></div>';
    li.querySelector('button').onclick = (ev)=>{
      navigator.clipboard.writeText(line);
      ev.target.textContent = '✓ کپی شد';
      setTimeout(()=>ev.target.textContent='کپی',1200);
    };
    list.appendChild(li);
  });
}

document.getElementById('q').oninput = (e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ render(ALL); return; }
  render(ALL.filter(l=>l.toLowerCase().includes(q)));
};

load().then(l=>{ALL=l;render(l);}).catch(e=>{
  document.getElementById('status').textContent = '⚠️ ' + e.message;
});
</script>
</body>
</html>
